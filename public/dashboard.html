<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - Tick.IT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="uber.css">
</head>
<body>
    <header class="nav">
        <a class="brand" href="/dashboard.html">Tick.IT</a>
        <div class="nav-right">
            <div class="nav-meta">
                <div class="nm-name" id="userName">Loading...</div>
                <div class="nm-sub">Rider</div>
            </div>
            <button class="logout-btn" onclick="logout()">Log out</button>
        </div>
    </header>

    <div class="container">
        <div class="page-title">
            <p class="eyebrow">Wallet balance</p>
            <h1>₹<span id="walletBalance">0</span></h1>
            <p>Your transport payment hub</p>
        </div>

        <div class="dashboard-grid">
            <!-- Current Valid Ticket Section -->
            <div class="card">
                <h3>Current ticket</h3>
                <div id="currentTicket" class="ticket-card" style="display: none;">
                    <div class="ticket-header">
                        <span class="ticket-id"></span>
                        <span class="ticket-status"></span>
                    </div>
                    <div class="ticket-details">
                        <p><strong>Vehicle ID:</strong> <span class="vehicle-id"></span></p>
                        <p><strong>Fare Paid:</strong> ₹<span class="fare-paid"></span></p>
                        <p><strong>Expires At:</strong> <span class="expires-at"></span></p>
                    </div>
                    <div class="time-remaining"></div>
                </div>
                <div id="noCurrentTicket" class="empty-state">
                    <h4>No Active Ticket</h4>
                    <p>Purchase a ticket to see it here</p>
                </div>
            </div>

            <!-- Fare Check and Payment Section -->
            <div class="card">
                <h3>Buy a ticket</h3>
                <div class="fare-input-group">
                    <input type="text" id="vehicleInput" placeholder="Enter Vehicle ID (e.g., BUS001)">
                    <button class="btn btn-secondary" onclick="checkFare()">Check fare</button>
                </div>
                
                <div id="fareDisplay" class="fare-display" style="display: none;">
                    <p class="eyebrow">Fare</p>
                    <div class="fare-amount">₹<span id="fareAmount">0</span></div>
                    <p>Validity: <span id="validityMinutes">30</span> minutes</p>
                    <button class="btn btn-lg" onclick="makePayment()">Pay now</button>
                </div>
                
                <div id="fareError" class="error-message" style="display: none;"></div>
                <div id="paymentSuccess" class="success-message" style="display: none;"></div>
            </div>

            <!-- Wallet Management Section -->
            <div class="card">
                <h3>Wallet</h3>
                <div class="balance-row">Current balance <strong>₹<span id="currentBalance">0</span></strong></div>
                
                <div class="wallet-actions">
                    <input type="number" class="fund-input" id="fundAmount" placeholder="Enter amount to add" min="1">
                    <button class="btn" onclick="addFunds()">Add funds</button>
                </div>
                
                <div id="walletMessage"></div>
            </div>
        </div>

        <!-- Ticket History Section -->
        <div class="card">
            <h3>Ticket history</h3>
            <div class="filter-buttons">
                <button class="active" onclick="filterTickets('all', event)">All tickets</button>
                <button onclick="filterTickets('valid', event)">Valid</button>
                <button onclick="filterTickets('expired', event)">Expired</button>
            </div>
            <div id="ticketHistory">
                <div class="loading">Loading tickets...</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = '/api';
        let currentUserId = localStorage.getItem('userId');
        let selectedVehicleId = '';
        let currentFare = 0;
        let allTickets = [];
        let currentTicketTimer = null;

        // Check if user is logged in
        if (!currentUserId) {
            window.location.href = 'index.html';
        }

        // Check fare for selected vehicle
        async function checkFare() {
            const vehicleId = document.getElementById('vehicleInput').value.trim();
            if (!vehicleId) {
                showError('fareError', 'Please enter a vehicle ID');
                return;
            }
            
            clearMessages();
            
            try {
                const response = await fetch(`${API_BASE_URL}/get-vehicle-fare/${vehicleId}`);
                const data = await response.json();
                
                if (data.success) {
                    selectedVehicleId = vehicleId;
                    currentFare = data.fare;
                    document.getElementById('fareAmount').textContent = data.fare;
                    document.getElementById('validityMinutes').textContent = data.validityMinutes;
                    document.getElementById('fareDisplay').style.display = 'block';
                } else {
                    showError('fareError', data.error || 'Vehicle not found');
                }
            } catch (error) {
                console.error('Error fetching fare:', error);
                showError('fareError', 'Failed to fetch fare information');
            }
        }

        // Make payment
        async function makePayment() {
            if (!selectedVehicleId || !currentFare) {
                showError('fareError', 'Please check fare first');
                return;
            }
            
            // Check if user has sufficient balance
            const currentBalance = parseInt(document.getElementById('walletBalance').textContent);
            if (currentBalance < currentFare) {
                showError('fareError', 'Insufficient balance. Please add funds to your wallet.');
                return;
            }
            
            clearMessages();
            
            try {
                const response = await fetch(`${API_BASE_URL}/pay`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: currentUserId,
                        vehicleId: selectedVehicleId
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showSuccess('paymentSuccess', `Payment successful! Ticket ID: ${data.ticketId.substring(0, 8)}`);
                    document.getElementById('fareDisplay').style.display = 'none';
                    document.getElementById('vehicleInput').value = '';
                    selectedVehicleId = '';
                    currentFare = 0;
                    
                    // Refresh data
                    loadUserData();
                    loadCurrentTicket();
                    loadTicketHistory();
                } else {
                    showError('fareError', data.error || 'Payment failed');
                }
            } catch (error) {
                console.error('Error making payment:', error);
                showError('fareError', 'Payment failed. Please try again.');
            }
        }

        // Load current valid ticket
        async function loadCurrentTicket() {
            try {
                const response = await fetch(`${API_BASE_URL}/get-user-tickets/${currentUserId}`);
                const tickets = await response.json();
                
                const validTicket = tickets.find(ticket => ticket.isValid);
                
                if (validTicket) {
                    displayCurrentTicket(validTicket);
                    startTicketTimer(validTicket);
                    document.getElementById('currentTicket').style.display = 'block';
                    document.getElementById('noCurrentTicket').style.display = 'none';
                } else {
                    document.getElementById('currentTicket').style.display = 'none';
                    document.getElementById('noCurrentTicket').style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading current ticket:', error);
                document.getElementById('noCurrentTicket').innerHTML = '<h4>Error</h4><p>Failed to load ticket information</p>';
            }
        }

        // Display current ticket
        function displayCurrentTicket(ticket) {
            const ticketElement = document.getElementById('currentTicket');
            ticketElement.querySelector('.ticket-id').textContent = `#${ticket.ticketId.substring(0, 8).toUpperCase()}`;
            
            const statusElement = ticketElement.querySelector('.ticket-status');
            statusElement.textContent = ticket.isValid ? 'VALID' : 'EXPIRED';
            statusElement.className = `ticket-status ${ticket.isValid ? 'valid' : 'expired'}`;
            
            ticketElement.querySelector('.vehicle-id').textContent = ticket.vehicleId;
            ticketElement.querySelector('.fare-paid').textContent = ticket.farePaid;
            
            if (ticket.expiresAt) {
                ticketElement.querySelector('.expires-at').textContent = new Date(ticket.expiresAt).toLocaleString();
            }
            
            ticketElement.className = `ticket-card ${ticket.isValid ? 'valid' : 'expired'}`;
        }

        // Start countdown timer for current ticket
        function startTicketTimer(ticket) {
            if (currentTicketTimer) {
                clearInterval(currentTicketTimer);
            }
            
            const timerElement = document.querySelector('.time-remaining');
            
            const updateTimer = () => {
                if (!ticket.expiresAt) {
                    timerElement.textContent = 'No expiry time';
                    return;
                }
                
                const now = new Date().getTime();
                const expiry = new Date(ticket.expiresAt).getTime();
                const timeLeft = expiry - now;
                
                if (timeLeft > 0) {
                    const hours = Math.floor(timeLeft / (1000 * 60 * 60));
                    const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);
                    
                    if (hours > 0) {
                        timerElement.textContent = `${hours}h ${minutes}m ${seconds}s remaining`;
                    } else {
                        timerElement.textContent = `${minutes}m ${seconds}s remaining`;
                    }
                    timerElement.className = 'time-remaining';
                } else {
                    timerElement.textContent = 'Expired';
                    timerElement.className = 'time-remaining expired';
                    clearInterval(currentTicketTimer);
                    loadCurrentTicket(); // Refresh to update status
                }
            };
            
            updateTimer();
            currentTicketTimer = setInterval(updateTimer, 1000);
        }

        // Load and display ticket history
        async function loadTicketHistory() {
            try {
                const response = await fetch(`${API_BASE_URL}/get-user-tickets/${currentUserId}`);
                allTickets = await response.json();
                
                displayTicketHistory(allTickets);
            } catch (error) {
                console.error('Error loading ticket history:', error);
                document.getElementById('ticketHistory').innerHTML = '<div class="error-message">Failed to load ticket history</div>';
            }
        }

        // Display ticket history
        function displayTicketHistory(tickets) {
            const historyElement = document.getElementById('ticketHistory');
            
            if (tickets.length === 0) {
                historyElement.innerHTML = '<div class="empty-state"><h4>No Tickets Found</h4><p>Your ticket history will appear here</p></div>';
                return;
            }
            
            historyElement.innerHTML = tickets.map(ticket => {
                const date = ticket.timestamp && ticket.timestamp.seconds 
                    ? new Date(ticket.timestamp.seconds * 1000).toLocaleString()
                    : 'Unknown date';
                
                const expiryDate = ticket.expiresAt 
                    ? new Date(ticket.expiresAt).toLocaleString()
                    : 'No expiry';
                
                return `
                    <div class="history-item ${ticket.isValid ? 'valid' : 'expired'}">
                        <div class="history-header">
                            <span class="ticket-id">#${ticket.ticketId.substring(0, 8).toUpperCase()}</span>
                            <span class="status ${ticket.isValid ? 'valid' : 'expired'}">${ticket.isValid ? 'VALID' : 'EXPIRED'}</span>
                        </div>
                        <div class="history-details">
                            <p><strong>Vehicle:</strong> ${ticket.vehicleId} | <strong>Fare:</strong> ₹${ticket.farePaid}</p>
                            <p><strong>Purchased:</strong> ${date}</p>
                            <p><strong>Expires:</strong> ${expiryDate}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Filter tickets
        function filterTickets(filter, event) {
            // Update active button
            document.querySelectorAll('.filter-buttons button').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            let filteredTickets = allTickets;
            
            if (filter === 'valid') {
                filteredTickets = allTickets.filter(ticket => ticket.isValid);
            } else if (filter === 'expired') {
                filteredTickets = allTickets.filter(ticket => !ticket.isValid);
            }
            
            displayTicketHistory(filteredTickets);
        }

        // Add funds to wallet
        async function addFunds() {
            const amount = parseInt(document.getElementById('fundAmount').value);
            
            if (!amount || amount < 1) {
                showWalletMessage('Please enter a valid amount', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/add-funds`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: currentUserId,
                        amount: amount
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showWalletMessage(`₹${amount} added successfully!`, 'success');
                    document.getElementById('fundAmount').value = '';
                    loadUserData(); // Refresh wallet balance
                } else {
                    showWalletMessage(data.error || 'Failed to add funds', 'error');
                }
            } catch (error) {
                console.error('Error adding funds:', error);
                showWalletMessage('Failed to add funds. Please try again.', 'error');
            }
        }

        // Load user data
        async function loadUserData() {
            try {
                const response = await fetch(`${API_BASE_URL}/get-user-details/${currentUserId}`);
                const userData = await response.json();
                
                if (userData.error) {
                    throw new Error(userData.error);
                }
                
                document.getElementById('userName').textContent = userData.fullName || 'User';
                document.getElementById('walletBalance').textContent = userData.walletBalance || 0;
                document.getElementById('currentBalance').textContent = userData.walletBalance || 0;
            } catch (error) {
                console.error('Error loading user data:', error);
                document.getElementById('userName').textContent = 'Error loading user';
            }
        }

        // Utility functions
        function clearMessages() {
            document.getElementById('fareError').style.display = 'none';
            document.getElementById('paymentSuccess').style.display = 'none';
        }

        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
            setTimeout(() => {
                element.style.display = 'none';
            }, 5000);
        }

        function showSuccess(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
            setTimeout(() => {
                element.style.display = 'none';
            }, 5000);
        }

        function showWalletMessage(message, type) {
            const messageElement = document.getElementById('walletMessage');
            messageElement.textContent = message;
            messageElement.className = type === 'error' ? 'error-message' : 'success-message';
            messageElement.style.display = 'block';
            setTimeout(() => {
                messageElement.style.display = 'none';
            }, 5000);
        }

        // Logout function
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('userId');
                localStorage.removeItem('userToken');
                localStorage.removeItem('userType');
                window.location.href = 'index.html';
            }
        }

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', function() {
            loadUserData();
            loadCurrentTicket();
            loadTicketHistory();
            
            // Auto-refresh current ticket every 30 seconds
            setInterval(loadCurrentTicket, 30000);
        });

        // Cleanup timer when page is closed
        window.addEventListener('beforeunload', function() {
            if (currentTicketTimer) {
                clearInterval(currentTicketTimer);
            }
        });
    </script>
</body>

</html>
