<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tick.IT — Smart Transit Payments</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/uber.css" />
  <!-- Firebase JS SDK for Google OAuth -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="app-container" style="padding-top: 48px;">
    <div style="text-align: center; margin-bottom: 28px;">
      <div class="brand" style="justify-content: center; font-size: 2rem;">
        🚍 Tick<span>.IT</span>
      </div>
      <p style="color: var(--text-muted); font-size: 0.92rem; margin-top: 4px;">
        Instant QR Transit Ticketing & Operator Ledger
      </p>
    </div>

    <div class="card">
      <!-- Role & Mode Switchers -->
      <div class="multiplier-group" style="grid-template-columns: 1fr 1fr; margin-bottom: 18px;">
        <button id="tabLogin" class="multiplier-btn active" onclick="switchMode('login')">Sign In</button>
        <button id="tabRegister" class="multiplier-btn" onclick="switchMode('register')">Create Account</button>
      </div>

      <div id="authAlert" class="alert-msg"></div>

      <form id="authForm" onsubmit="handleAuthSubmit(event)">
        <div id="nameGroup" class="input-group" style="display: none;">
          <label>Full Name</label>
          <input type="text" id="nameInput" class="input" placeholder="e.g., Rudranil Goswami" />
        </div>

        <div class="input-group">
          <label>Email Address</label>
          <input type="email" id="emailInput" class="input" placeholder="you@example.com" required />
        </div>

        <div class="input-group">
          <label>Password</label>
          <input type="password" id="passwordInput" class="input" placeholder="••••••••" required />
        </div>

        <div class="input-group">
          <label>Account Role</label>
          <select id="roleInput" class="input">
            <option value="passenger">Passenger / Rider</option>
            <option value="owner">Vehicle Owner / Driver</option>
          </select>
        </div>

        <button type="submit" id="submitBtn" class="btn" style="margin-top: 8px;">Sign In</button>
      </form>

      <div style="display: flex; align-items: center; margin: 18px 0; color: var(--text-muted); font-size: 0.8rem;">
        <div style="flex: 1; height: 1px; background: var(--border);"></div>
        <span style="padding: 0 10px;">OR CONTINUE WITH</span>
        <div style="flex: 1; height: 1px; background: var(--border);"></div>
      </div>

      <button type="button" class="btn btn-secondary" onclick="signInWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Google Sign-In
      </button>
    </div>
  </div>

  <script>
    // Replace with your Firebase Web Config if using live Google Auth popup
    const firebaseConfig = window.FIREBASE_CONFIG || {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "your-app.firebaseapp.com",
      projectId: "your-project-id"
    };
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    } catch (e) {
      console.warn("Firebase client init skipped:", e);
    }

    let authMode = 'login';

    function switchMode(mode) {
      authMode = mode;
      document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
      document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
      document.getElementById('nameGroup').style.display = mode === 'register' ? 'block' : 'none';
      document.getElementById('submitBtn').textContent = mode === 'login' ? 'Sign In' : 'Create Account';
      hideAlert();
    }

    function showAlert(msg, isError = true) {
      const el = document.getElementById('authAlert');
      el.textContent = msg;
      el.className = 'alert-msg ' + (isError ? 'alert-error' : 'alert-success');
    }

    function hideAlert() {
      const el = document.getElementById('authAlert');
      el.className = 'alert-msg';
      el.textContent = '';
    }

    function redirectByRole(user) {
      if (user.role === 'owner') {
        window.location.href = '/owner_dashboard.html';
      } else {
        window.location.href = '/dashboard.html';
      }
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      hideAlert();
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const role = document.getElementById('roleInput').value;
      const name = document.getElementById('nameInput').value.trim();

      const endpoint = authMode === 'login' ? '/api/auth/login' : '/api/auth/register';
      const payload = authMode === 'login' ? { email, password } : { name, email, password, role };

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) {
          showAlert(data.error || 'Authentication failed.');
          return;
        }
        localStorage.setItem('tickit_token', data.token);
        localStorage.setItem('tickit_user', JSON.stringify(data.user));
        redirectByRole(data.user);
      } catch (err) {
        showAlert('Network error connecting to Tick.IT server.');
      }
    }

    async function signInWithGoogle() {
      hideAlert();
      const role = document.getElementById('roleInput').value;
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        const result = await firebase.auth().signInWithPopup(provider);
        const idToken = await result.user.getIdToken();

        const res = await fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idToken, role })
        });
        const data = await res.json();
        if (!res.ok) {
          showAlert(data.error || 'Google verification failed.');
          return;
        }
        localStorage.setItem('tickit_token', data.token);
        localStorage.setItem('tickit_user', JSON.stringify(data.user));
        redirectByRole(data.user);
      } catch (err) {
        showAlert('Google Sign-In requires a configured Firebase project key in index.html: ' + err.message);
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
