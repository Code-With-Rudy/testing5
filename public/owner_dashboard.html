<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tick.IT — Operator Control Panel</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/uber.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
  <div class="app-container wide-container">
    <div class="topbar">
      <div class="brand">🚍 Tick<span>.IT</span> <small style="font-size: 0.75rem; color: var(--text-muted); margin-left: 6px;">OPERATOR</small></div>
      <button class="btn btn-secondary btn-sm" onclick="logout()">Sign Out</button>
    </div>

    <!-- Earnings & Primary Actions -->
    <div class="card wallet-card">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px;">
        <div>
          <div style="font-size: 0.8rem; color: #a7f3d0; font-weight: 600;">TOTAL VEHICLE REVENUE</div>
          <div id="ownerEarnings" class="balance-amount">₹0.00</div>
          <div id="ownerStatsSub" style="font-size: 0.85rem; color: #d1fae5;">0 Tickets • 0 Passengers</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px; min-width: 190px;">
          <button class="btn" onclick="openDriverScanner()">📷 Scan Passenger Ticket</button>
          <button class="btn btn-secondary" onclick="exportEarningsCSV()">📥 Export CSV Report</button>
        </div>
      </div>
    </div>

    <!-- Off-Duty Operational Switch -->
    <div class="card">
      <div class="switch-row">
        <div>
          <div style="font-weight: 700;">Service Status (<span id="dutyStatusText" style="color: var(--primary);">ACTIVE ON-DUTY</span>)</div>
          <div style="font-size: 0.82rem; color: var(--text-muted);">Toggle Off-Duty to immediately block incoming passenger payments.</div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="offDutyToggle" onchange="toggleOffDuty(this.checked)" />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Printable Vehicle QR Code & Route Configuration -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px;">
      <div class="card" style="text-align: center;">
        <div style="font-weight: 700; margin-bottom: 4px;">Transit Vehicle QR</div>
        <div id="qrVehicleSubtitle" style="font-size: 0.82rem; color: var(--text-muted);">VID-XXXX</div>
        <div id="ownerQrBox" class="qr-box"></div>
        <div style="display: flex; gap: 8px; margin-top: 10px;">
          <button class="btn btn-secondary btn-sm" style="flex: 1;" onclick="downloadVehicleQR()">Download PNG</button>
          <button class="btn btn-secondary btn-sm" style="flex: 1;" onclick="window.print()">Print QR</button>
        </div>
      </div>

      <div class="card">
        <div style="font-weight: 700; margin-bottom: 12px;">Route & Fare Management</div>
        <div id="vehicleSaveAlert" class="alert-msg"></div>
        <form onsubmit="saveVehicleConfig(event)">
          <div class="input-group">
            <label>Vehicle Number</label>
            <input type="text" id="cfgVehicleNumber" class="input" required />
          </div>
          <div class="input-group">
            <label>Route Name</label>
            <input type="text" id="cfgRouteName" class="input" required />
          </div>
          <div class="input-group">
            <label>Base Fare (₹)</label>
            <input type="number" step="0.5" id="cfgBaseFare" class="input" required />
          </div>
          <button type="submit" class="btn">Update Vehicle Details</button>
        </form>
      </div>
    </div>

    <!-- Ticket Validation & Redemption Feed -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <div style="font-weight: 700;">Issued Tickets & Redemptions</div>
        <div style="display: flex; gap: 6px;">
          <input type="text" id="manualTicketInput" class="input" placeholder="TK-XXXX" style="width: 140px; padding: 6px 10px;" />
          <button class="btn btn-sm" onclick="verifyManualTicket()">Verify</button>
        </div>
      </div>
      <div id="ownerTicketsList" style="font-size: 0.9rem; color: var(--text-muted);">Loading records...</div>
    </div>
  </div>

  <!-- Driver Ticket Scanner Modal -->
  <div id="driverScannerModal" class="modal-overlay">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3>Validate Passenger Ticket</h3>
        <button class="btn btn-secondary btn-sm" onclick="closeDriverScanner()">✕</button>
      </div>
      <div id="driverQrReader" style="width: 100%; border-radius: 10px; overflow: hidden;"></div>
      <div id="verifyResultBanner" class="alert-msg" style="margin-top: 14px; text-align: center; font-weight: 700;"></div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('tickit_token');
    if (!token) window.location.href = '/index.html';

    let currentVehicle = null;
    let ownerTickets = [];
    let driverScanner = null;

    function authHeaders() {
      return {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      };
    }

    async function loadOwnerDashboard() {
      try {
        const res = await fetch('/api/owner/vehicle', { headers: authHeaders() });
        if (res.status === 401) return logout();
        const data = await res.json();
        currentVehicle = data.vehicle;
        ownerTickets = data.tickets || [];

        document.getElementById('ownerEarnings').textContent = `₹${parseFloat(data.stats.totalEarnings).toFixed(2)}`;
        document.getElementById('ownerStatsSub').textContent = `${data.stats.totalTickets} Tickets • ${data.stats.totalPassengers} Passengers`;

        document.getElementById('cfgVehicleNumber').value = currentVehicle.vehicleNumber;
        document.getElementById('cfgRouteName').value = currentVehicle.routeName;
        document.getElementById('cfgBaseFare').value = currentVehicle.baseFare;

        updateOffDutyUI(currentVehicle.isOffDuty);
        renderOwnerQR(currentVehicle);
        renderOwnerTickets(ownerTickets);
      } catch (e) {
        console.error(e);
      }
    }

    function updateOffDutyUI(isOffDuty) {
      const toggle = document.getElementById('offDutyToggle');
      const statusText = document.getElementById('dutyStatusText');
      toggle.checked = !!isOffDuty;
      if (isOffDuty) {
        statusText.textContent = 'OFF-DUTY (PAUSED)';
        statusText.style.color = '#f87171';
      } else {
        statusText.textContent = 'ACTIVE ON-DUTY';
        statusText.style.color = '#10b981';
      }
    }

    async function toggleOffDuty(isOffDuty) {
      const res = await fetch('/api/owner/status', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ isOffDuty })
      });
      if (res.ok) {
        const data = await res.json();
        currentVehicle = data.vehicle;
        updateOffDutyUI(currentVehicle.isOffDuty);
      }
    }

    function renderOwnerQR(vehicle) {
      document.getElementById('qrVehicleSubtitle').textContent = `${vehicle.vehicleId} • ${vehicle.routeName}`;
      const box = document.getElementById('ownerQrBox');
      box.innerHTML = '';
      const payload = JSON.stringify({
        type: 'TICKIT_VEHICLE',
        vehicleId: vehicle.vehicleId,
        ownerId: vehicle.ownerId,
        routeName: vehicle.routeName
      });
      new QRCode(box, {
        text: payload,
        width: 190,
        height: 190
      });
    }

    function downloadVehicleQR() {
      const img = document.querySelector('#ownerQrBox img') || document.querySelector('#ownerQrBox canvas');
      if (!img) return;
      const url = img.src || img.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url;
      a.download = `${currentVehicle.vehicleId}_QR.png`;
      a.click();
    }

    async function saveVehicleConfig(e) {
      e.preventDefault();
      const alertEl = document.getElementById('vehicleSaveAlert');
      const payload = {
        vehicleNumber: document.getElementById('cfgVehicleNumber').value,
        routeName: document.getElementById('cfgRouteName').value,
        baseFare: parseFloat(document.getElementById('cfgBaseFare').value)
      };
      const res = await fetch('/api/owner/vehicle', {
        method: 'PUT',
        headers: authHeaders(),
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) {
        alertEl.textContent = data.error || 'Update failed.';
        alertEl.className = 'alert-msg alert-error';
        return;
      }
      currentVehicle = data.vehicle;
      renderOwnerQR(currentVehicle);
      alertEl.textContent = 'Vehicle details updated!';
      alertEl.className = 'alert-msg alert-success';
      setTimeout(() => { alertEl.className = 'alert-msg'; }, 2500);
    }

    // --- Driver Ticket Verification & Camera Scanner ---
    function openDriverScanner() {
      const banner = document.getElementById('verifyResultBanner');
      banner.className = 'alert-msg';
      banner.textContent = '';
      document.getElementById('driverScannerModal').classList.add('open');

      driverScanner = new Html5Qrcode("driverQrReader");
      driverScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 240, height: 240 } },
        async (decodedText) => {
          let ticketId = decodedText.trim();
          try {
            const parsed = JSON.parse(decodedText);
            if (parsed.ticketId) ticketId = parsed.ticketId;
          } catch (_) {}
          await verifyTicketRequest(ticketId);
        },
        () => {}
      ).catch(err => console.warn("Driver scanner camera error:", err));
    }

    function closeDriverScanner() {
      document.getElementById('driverScannerModal').classList.remove('open');
      if (driverScanner) {
        driverScanner.stop().then(() => driverScanner.clear()).catch(() => {});
        driverScanner = null;
      }
    }

    async function verifyManualTicket() {
      const tid = document.getElementById('manualTicketInput').value.trim().toUpperCase();
      if (!tid) return;
      const res = await fetch('/api/tickets/verify', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ ticketId: tid })
      });
      const data = await res.json();
      alert(`${data.badge}: ${data.message || data.error}`);
      loadOwnerDashboard();
    }

    async function verifyTicketRequest(ticketId) {
      const banner = document.getElementById('verifyResultBanner');
      const res = await fetch('/api/tickets/verify', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ ticketId })
      });
      const data = await res.json();
      if (res.ok && data.valid) {
        banner.textContent = `✅ ${data.badge} — ${data.message}`;
        banner.className = 'alert-msg alert-success';
      } else {
        banner.textContent = `❌ ${data.badge || 'REJECTED'} — ${data.error}`;
        banner.className = 'alert-msg alert-error';
      }
      await loadOwnerDashboard();
    }

    function renderOwnerTickets(tickets) {
      const container = document.getElementById('ownerTicketsList');
      if (!tickets.length) {
        container.innerHTML = '<p>No passenger tickets issued yet.</p>';
        return;
      }
      container.innerHTML = tickets.map(t => `
        <div class="list-item">
          <div>
            <div style="font-weight: 700;">${t.ticketId} • ${t.passengerCount} Passenger(s)</div>
            <div style="font-size: 0.76rem; color: var(--text-muted);">Issued: ${new Date(t.issuedAt).toLocaleString()}</div>
          </div>
          <div style="text-align: right;">
            <div style="font-weight: 700;">₹${parseFloat(t.farePaid).toFixed(2)}</div>
            <span class="badge badge-${t.status.toLowerCase()}">${t.status}</span>
          </div>
        </div>
      `).join('');
    }

    // --- One-Click CSV Export ---
    function exportEarningsCSV() {
      let csv = 'Ticket ID,Passengers,Fare Paid,Status,Issued At\n';
      ownerTickets.forEach(t => {
        csv += `${t.ticketId},${t.passengerCount},${t.farePaid},${t.status},${t.issuedAt}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.setAttribute('href', url);
      a.setAttribute('download', `TickIT_Report_${new Date().toISOString().slice(0,10)}.csv`);
      a.click();
    }

    function logout() {
      localStorage.removeItem('tickit_token');
      localStorage.removeItem('tickit_user');
      window.location.href = '/index.html';
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

    loadOwnerDashboard();
  </script>
</body>
</html>
